        <script type="text/javascript">
        src = "https://kit.fontawesome.com/64d58efce2.js"
        crossorigin = "anonymous"


        const sign_in_btn = document.querySelector("#sign-in-btn");
        const sign_up_btn = document.querySelector("#sign-up-btn");
        const container = document.querySelector(".container");

        sign_up_btn.addEventListener("click", () => {
            container.classList.add("sign-up-mode");
        });

        sign_in_btn.addEventListener("click", () => {
            container.classList.remove("sign-up-mode");
        });




        $(document).ready(function() {

            var url = $("#__url").val()
            console.log(url + "/login/check_login")

            $("#login_btn ").click(function() {


                $.post(url + "/login/check_login", {
                    _token: "q0uZCoslQZqBIlC3AyOmkvFd9Go7Gyv9ISMlP1lp",
                    id: $("#user").val(),
                    password: $("#pass").val()
                }, function(data) {
                    var js = JSON.parse(data);
                    console.log(js.status);
                    if (js.status == "PASS") {
                        alert("เข้าสู่ระบบสำเร็จ")
                        window.location = url + "/manage/"


                    } else {
                        alert("user หรือ หรัสผ่านผิดพลาด")
                    }
                    console.log(js.detail);





                    // alert("Data: " + data + "\nStatus: " + status);
                });




            });


            $("#register ").click(function() {


                $.post(url + "/register/check_login", {
                    _token: "q0uZCoslQZqBIlC3AyOmkvFd9Go7Gyv9ISMlP1lp",
                    id: $("#ruser").val(),
                    password: $("#rpass").val(),
                    gmail: $("#rgmail").val()
                }, function(data) {






                    var js = JSON.parse(data);



                    console.log(js.status);
                    if (js.status == "PASS") {
                        alert("สมัครสำเร็จ")
                        window.location = url + "/login"


                    } else {
                        alert("สมัครสมาชิกไม่สำเร็จ")
                    }
                    console.log(js.detail);





                    // alert("Data: " + data + "\nStatus: " + status);
                });


            });


        });

        body {

        .input-field {

            width: 100%;

            transition: transform 1.1s ease-in-out;
            transition-delay: 0.4s;
        }

        .panel {

            flex-direction: column;
            align-items: flex-end;
            justify-content: space-around;
            text-align: center;
            z-index: 6;
        }

        .left-panel {
            pointer-events: all;
            padding: 3rem 17% 2rem 12%;
        }

        .right-panel {
            pointer-events: none;
            padding: 3rem 12% 2rem 17%;

        .panel .content {

                padding-right: 15%;

                height: 1500px;

                left: 30%;
                bottom: 68%;

                top: initial;
                transition: 2s ease-in-out;

            .container.sign-up-mode:before {

        @media (max-width: 570px) {
